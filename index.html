<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Clockwork Sanctum</title>
  <meta name="description" content="Sunlit isometric clockwork puzzle-chase in Three.js where you bounce golden sunbeams to shatter Stone Gargoyles, outsmart the stalking Shadow Rogue, and summon Mage's Astral Aid." />
  <meta property="og:title" content="Clockwork Sanctum" />
  <meta property="og:description" content="Sunlit isometric clockwork puzzle-chase in Three.js where you bounce golden sunbeams to shatter Stone Gargoyles, outsmart the stalking Shadow Rogue, and summon Mage's Astral Aid." />
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #4FA6E8;
      user-select: none;
      -webkit-user-select: none;
    }
    #canvas-container {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      z-index: 1;
    }
    #game-canvas {
      display: block;
      width: 100%;
      height: 100%;
      outline: none;
      touch-action: none;
    }
    #hud-root {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 20;
    }
  </style>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="canvas-container">
    <canvas id="game-canvas"></canvas>
  </div>
  <div id="hud-root"></div>
  <div id="root" style="display:none"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
